name: one-off backtest
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I .github/backtest/wind_drives.py games.csv
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: games.csv
