name: one-off backtest
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backtest
          run-id: 43366001095
          github-token: ${{ github.token }}
      - run: wc -l games.csv && python3 -I .github/backtest/analyze.py games.csv
