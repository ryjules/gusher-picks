name: Refresh picks

on:
  schedule:
    # GitHub cron is UTC (Eastern Standard Time is UTC-5; GitHub often starts runs 20-50 minutes late):
    # 8:40 AM, 12:40 PM, 4:40 PM, 6:40 PM (late injuries before tip-off) and 1:10 AM (grades late games) ET.
    - cron: "40 13 * * *"
    - cron: "40 17 * * *"
    - cron: "40 21 * * *"
    - cron: "40 23 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy==2.1.3 tzdata==2024.2

      - name: Build the site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p cache docs/data
          python build/fetch.py cache games.json docs/data/modelpicks.json docs/data/modelpicks.json
          python build/inject.py build/board.template.html games.json docs/index.html

      - name: Build the hockey page
        # Separate step: a hockey failure never blocks the main board.
        continue-on-error: true
        run: |
          python build/nhl_build.py cache nhl.json
          python build/nhl_track.py nhl.json docs/data/nhlpicks.json nhl_page.json
          python build/inject.py build/nhl.template.html nhl_page.json docs/nhl.html

      - name: Publish
        run: |
          git config user.name "gushers-picks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Refresh picks $(date -u +%Y-%m-%dT%H:%MZ)"
          # A change pushed while this run was building would reject the push: rebase onto it (keeping this
          # run's fresh build of docs/) and try again rather than losing the rebuild.
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          git push
