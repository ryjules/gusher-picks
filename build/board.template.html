<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gushers Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: broadcast-style stat board. Game rail on the left, one matchup board on the right:
   team header bar, teal info strip, betting line row, offense / defense / situational tables, confidence bar. */
:root {
  color-scheme: dark;
  --bg: #0a0e14; --board: #141a22; --row: #10151c; --line: #222b36; --ink: #f2f5f8; --muted: #8d99a8;
  --teal: #1aa3b8; --teal-deep: #0f7f91; --cyan: #34c8dc; --gold: #f2c230;
  --win: #18a957; --loss: #e0313b; --mid: #f0b429; --hot: #f07a29;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(32px, env(safe-area-inset-bottom, 0px)); margin: 0; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* Game rail */
.rail { display: grid; gap: 10px; align-content: start; }
@media (min-width: 901px) {
  .rail { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 32px); grid-template-rows: auto auto auto auto minmax(0, 1fr); align-self: start; }
  .games { overflow-y: auto; padding-right: 4px; }
}
.rail h1 { font: 800 1.5rem var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tabs button { flex: 1; font: 700 .95rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; padding: 8px; background: var(--board); color: var(--muted); border: 0; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.games { display: grid; gap: 6px; }
@media (max-width: 900px) { .games { max-height: 340px; overflow-y: auto; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
.game-btn { text-align: left; background: var(--board); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--ink); cursor: pointer; display: grid; gap: 2px; font: 600 .9rem var(--f-body); }
.game-btn small { color: var(--muted); font-weight: 500; }
.live-at { display: block; color: var(--muted); font-size: .72rem; margin: 2px 2px 0; min-height: 0; }
.game-btn[aria-current="true"] { border-color: var(--cyan); box-shadow: inset 3px 0 0 var(--cyan); }
.empty { color: var(--muted); font-size: .85rem; line-height: 1.45; background: var(--board); border: 1px dashed var(--line); border-radius: 4px; padding: 12px; margin: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Board */
.board { background: var(--board); border: 1px solid var(--line); min-width: 0; }
.scroll { overflow-x: auto; }
.inner { min-width: 1060px; }
.teams { display: grid; grid-template-columns: 1fr 1fr; background: #0d1218; }
.team { display: flex; flex-wrap: nowrap; align-items: center; gap: 14px; padding: 10px 14px; }
.team.away { flex-direction: row-reverse; text-align: right; }
.logo { width: 92px; height: 92px; flex: none; border: 3px solid #d7dde4; border-radius: 6px; display: grid; place-items: center; font: 800 2.4rem var(--f-display); letter-spacing: -.02em; }
.tname { font: 800 2rem var(--f-display); line-height: 1; margin-bottom: 8px; }
.tmeta { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.team.away .tmeta { flex-direction: row-reverse; }
.kv { display: grid; text-align: center; }
.kv span { font: 700 .72rem var(--f-display); letter-spacing: .06em; color: #c9d1da; text-transform: uppercase; }
.kv b { font: 700 1.3rem var(--f-display); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.res { display: grid; text-align: center; gap: 2px; }
.res span { font: 700 .72rem var(--f-display); color: #c9d1da; }
.res b { font: 700 1rem var(--f-display); padding: 1px 6px; border-radius: 2px; color: #fff; }
.res b.W { background: var(--win); } .res b.L { background: var(--loss); } .res b.T { background: #5d6875; }

.strip { display: grid; grid-template-columns: 1.1fr 1.2fr 1.3fr .7fr 1.3fr 1.3fr 1.3fr; background: var(--teal); }
.strip div { padding: 6px 14px; }
.strip span { display: block; font: 700 .72rem var(--f-display); letter-spacing: .07em; color: #d6f4f8; text-transform: uppercase; }
.strip b { font: 700 1rem var(--f-display); color: #fff; }

.lines { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); background: #0c1117; }
.lines div { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-right: 1px solid var(--line); gap: 8px; }
.lines div:last-child { border-right: 0; }
.lines span { font: 700 .8rem var(--f-display); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.lines b { font: 800 1.55rem var(--f-display); }

.sect { display: flex; justify-content: space-between; padding: 10px 26px 4px; }
.sect h2 { margin: 0; font: 800 1.25rem var(--f-display); color: var(--cyan); text-transform: uppercase; letter-spacing: .02em; }
.ball { display: inline-block; width: 18px; height: 12px; border-radius: 50%; background: #c8642e; transform: rotate(-30deg); margin: 0 6px; vertical-align: middle; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
th:first-child, th:last-child { width: 13%; }
th { font: 700 .8rem var(--f-display); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { font: 600 1.05rem var(--f-body); padding: 4px 8px; text-align: center; border-bottom: 1px solid #1a212b; }
tr:nth-child(even) td { background: var(--row); }
td.stat { font: 700 1.05rem var(--f-body); }
td.stat.l { text-align: right; } td.stat.r { text-align: left; }
td.rank { font-weight: 700; }
.g { color: var(--win); } .y { color: var(--mid); } .o { color: var(--hot); } .rd { color: var(--loss); }
.tlogo { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 4px; }
.logo.has-img, .adv.has-img { background: transparent !important; }
.logo.has-img span, .adv.has-img b { display: none; }
.logo img { width: 78px; height: 78px; object-fit: contain; }
.adv.has-img { border-color: transparent; }
.adv img { width: 20px; height: 20px; object-fit: contain; }
.adv { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid #d7dde4; border-radius: 3px; font: 800 .62rem var(--f-display); }
.dash { color: var(--muted); }

.conf-h { padding: 12px 26px 4px; font: 800 1.05rem var(--f-display); color: var(--cyan); text-transform: uppercase; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.conf-h small { font: 600 .8rem var(--f-body); color: var(--muted); text-transform: none; }
.conf { display: grid; grid-template-columns: repeat(3, 1fr); background: #0c1117; border-top: 1px solid var(--line); }
.conf div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px; border-right: 1px solid var(--line); }
.conf div:last-child { border-right: 0; }
.conf span { font: 700 .9rem var(--f-display); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.conf b { font: 800 1.9rem var(--f-display); }
.conf em { font: 800 1.15rem var(--f-display); font-style: normal; text-transform: uppercase; }
.c-hi { color: var(--win); } .c-md { color: var(--gold); } .c-pass { color: var(--hot); } .c-lo { color: var(--loss); }
.model { padding: 10px 26px 14px; color: var(--muted); font-size: .9rem; line-height: 1.5; border-top: 1px solid var(--line); }
.model b { color: var(--ink); }
.search { font: 600 .95rem var(--f-body); background: var(--board); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; }
.search:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.day { font: 700 .78rem var(--f-display); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
.gtop { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.st { font: 700 .72rem var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.st.live { color: var(--loss); }
.picks { display: flex; gap: 4px; flex-wrap: wrap; }
.pk { font: 700 .7rem var(--f-display); letter-spacing: .03em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; background: #173524; color: var(--win); }
.pk.lean { background: #3a2f14; color: var(--gold); }
.banner { padding: 7px 14px; background: #2a1215; color: #ffb3b8; font: 700 .95rem var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.banner.post { background: #1c232c; color: #c9d1da; }
.views { display: flex; gap: 6px; }
.views button { flex: 1; font: 700 .9rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; padding: 7px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.views button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.props { padding: 16px 18px 20px; display: grid; gap: 14px; }
.props h2 { margin: 0; font: 800 1.9rem var(--f-display); text-transform: uppercase; }
.pbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.cats { display: flex; flex-wrap: wrap; gap: 2px; background: #0c1117; border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
.cats button { font: 600 .95rem var(--f-body); background: transparent; color: #c9d1da; border: 0; border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.cats button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.gsel { font: 600 .95rem var(--f-body); background: #0c1117; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 100%; }
.ptab { table-layout: auto; }
.ptab td { font-size: 1rem; padding: 10px 8px; }
.ptab th { text-align: left; }
.ptab td.pn { text-align: left; font-weight: 700; } .ptab td.pn small { color: var(--muted); font-weight: 600; margin-left: 4px; }
.ptab td.op { text-align: left; } .ptab td.op small { color: var(--muted); }
.score { display: inline-block; min-width: 50px; padding: 4px 8px; border-radius: 4px; font: 800 1.15rem var(--f-display); text-align: center; border: 1.5px solid; }
.score.hi { color: var(--win); border-color: var(--win); background: #102a1b; }
.score.md { color: var(--gold); border-color: var(--gold); background: #2a2410; }
.score.lo { color: var(--muted); border-color: var(--line); }
.ptab td.ln { text-align: left; white-space: nowrap; font-weight: 700; } .ptab td.ln b { color: var(--cyan); }
.proj { display: inline-block; min-width: 58px; font: 700 1.05rem var(--f-display); color: var(--ink); }
.chips { display: flex; gap: 4px; flex-wrap: nowrap; }
.chip5 { min-width: 44px; padding: 2px 6px; border-radius: 3px; font: 700 .95rem var(--f-display); color: #c9d1da; text-align: center; }
.chip5.hi { color: var(--win); border: 1px solid var(--win); background: #102a1b; }
.pnote { color: var(--muted); font-size: .88rem; line-height: 1.5; margin: 0; }
.foot { max-width: 1500px; margin: 14px auto 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
.tabs { flex-wrap: wrap; }
.tabs button { min-width: 50%; }
.myplays { font: 800 1rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; padding: 9px; border-radius: 4px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
.myplays[aria-pressed="true"] { background: var(--gold); color: #1a1405; }
.add { font: 700 .72rem var(--f-display); letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); background: transparent; color: var(--cyan); border-radius: 3px; padding: 2px 7px; cursor: pointer; }
.add:hover { border-color: var(--cyan); }
.conf div { flex-wrap: wrap; }
.single h2 { color: var(--cyan); }
.plays { padding: 18px 20px 24px; display: grid; gap: 16px; }
.plays h2 { margin: 0; font: 800 2rem var(--f-display); text-transform: uppercase; }
.pnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pbtn { font: 600 .95rem var(--f-body); border: 1px solid var(--line); background: #0c1117; color: var(--ink); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.pbtn:hover { border-color: #3a4552; }
.pbtn[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.pdate { font: 700 1.15rem var(--f-body); padding: 0 6px; min-width: 150px; text-align: center; }
.spacer { flex: 1; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: #0c1117; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card span { display: block; color: var(--muted); font-size: .9rem; }
.card b { display: block; font: 800 2.1rem var(--f-display); margin: 2px 0; font-variant-numeric: tabular-nums; }
.card small { color: var(--muted); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.lg-h { font: 800 1.1rem var(--f-display); color: var(--cyan); text-transform: uppercase; margin: 6px 0 -6px; }
.lg-h small { color: var(--muted); font: 600 .9rem var(--f-body); text-transform: none; margin-left: 6px; }
.ptbl td { font-size: .98rem; padding: 10px 8px; text-align: left; }
.ptbl th { text-align: left; }
.ptbl { table-layout: auto; }
.ptbl td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.ptbl .mu { color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptbl .play { font-weight: 700; }
.res3 { display: inline-flex; gap: 3px; }
.res3 button { font: 800 .85rem var(--f-display); width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.res3 button.on.W { background: var(--win); border-color: var(--win); color: #fff; }
.res3 button.on.L { background: var(--loss); border-color: var(--loss); color: #fff; }
.res3 button.on.P { background: #5d6875; border-color: #5d6875; color: #fff; }
.del { background: transparent; border: 0; color: var(--loss); cursor: pointer; font: 700 .8rem var(--f-body); opacity: .7; }
.del:hover { opacity: 1; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; background: #0c1117; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.form label { display: grid; gap: 4px; font: 700 .75rem var(--f-display); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.form input, .form select { font: 600 .95rem var(--f-body); background: var(--board); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; width: 100%; min-width: 0; }
.form .wide { grid-column: span 2; }
@media (max-width: 500px) { .form .wide { grid-column: auto; } }
.form .actions { display: flex; gap: 8px; align-items: end; }
.tmeta { flex-wrap: nowrap; gap: 10px; }
.res b { padding: 1px 4px; }
.save { white-space: nowrap; font: 800 .95rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; background: var(--teal); color: #fff; border: 0; border-radius: 4px; padding: 9px 14px; cursor: pointer; }
.msg { color: var(--muted); font-size: .9rem; margin: 0; min-height: 1.2em; }
.msg.err { color: #ffb3b8; }
.lines div.lc { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 8px; }
.lines div.lc span { white-space: nowrap; }
.lines div.lc b { justify-self: end; }
.lines div.lc small { grid-column: 1 / -1; justify-self: end; font: 600 .74rem var(--f-body); color: var(--muted); white-space: nowrap; }
tr.xrow { cursor: pointer; }
button.xp { margin-left: 6px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 2px 7px; cursor: pointer; font-size: .8rem; }
tr.logrow > td { padding: 4px 8px 12px; background: rgba(255, 255, 255, .02); }
.plog table { width: auto; min-width: 420px; border-collapse: collapse; }
.plog th { font-size: .7rem; letter-spacing: .06em; color: var(--muted); padding: 6px 14px; text-align: center; font-weight: 700; }
.plog td { padding: 5px 14px; text-align: center; border-top: 1px solid var(--line); }
.plog td.dim { color: var(--muted); }
.plog td.main { font-weight: 800; }
.plog td.main.g { color: var(--win); }
.plog tr.avg td { font-weight: 800; border-top: 2px solid var(--line); }
.plog tr.avg td:first-child { color: var(--accent, var(--gold)); }
.score.or { color: var(--hot); border-color: var(--hot); background: #2c1a0d; }
.score.rd { color: var(--loss); border-color: var(--loss); background: #2a1215; }
.ptab td.rk { color: var(--muted); font-weight: 600; }
.ptab td.ln { line-height: 1.2; } .ptab td.ln .pr { color: #c9d1da; font-weight: 600; }
.ptab td.ln small.mv { display: block; font: 600 .72rem var(--f-body); }
.mv.up { color: var(--win); } .mv.dn { color: var(--loss); }
.ptab td.sm { font: 700 .95rem var(--f-body); line-height: 1.2; } .ptab td.sm small { display: block; color: var(--muted); font-weight: 600; font-size: .75rem; }
.ptab tr.nl td { color: var(--muted); }
.ptab td.pn small.flag { display: block; margin: 2px 0 0; color: var(--gold); font-size: .72rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 700 .9rem var(--f-body); background: #0c1117; color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.unit { display: inline-flex; align-items: center; gap: 4px; font: 600 .95rem var(--f-body); color: var(--muted); }
.unit input { width: 80px; font: 700 .95rem var(--f-body); background: #0c1117; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
.ptbl small.muted { color: var(--muted); font-weight: 600; }
.chart { background: #0c1117; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.ch-h { display: flex; justify-content: space-between; align-items: baseline; font: 600 .9rem var(--f-body); color: var(--muted); }
.ch-h b { font: 800 1.4rem var(--f-display); }
.ch-grid { display: grid; grid-template-columns: 58px 1fr; margin: 10px 0 2px; }
.ch-y { position: relative; height: 190px; }
.ch-y span { position: absolute; right: 8px; transform: translateY(-50%); font: 600 .78rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ch-plot { position: relative; height: 190px; touch-action: pan-y; cursor: crosshair; }
.ch-plot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ch-gl { stroke: var(--line); stroke-width: 1; }
.ch-zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.ch-line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.ch-line.pos { stroke: var(--win); } .ch-line.neg { stroke: var(--loss); }
.ch-fill.pos { fill: var(--win); opacity: .12; } .ch-fill.neg { fill: var(--loss); opacity: .12; }
.ch-pt { stroke-width: 8; stroke-linecap: round; } .ch-pt.pos { stroke: var(--win); } .ch-pt.neg { stroke: var(--loss); }
.ch-cross { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.ch-tip { position: absolute; top: 2px; transform: translateX(-50%); background: var(--board); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 600 .8rem var(--f-body); color: var(--ink); display: grid; gap: 2px; white-space: nowrap; pointer-events: none; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.ch-tip span { color: var(--muted); }
.ch-xa { position: relative; height: 22px; border-top: 1px solid var(--line); }
.ch-xa span { position: absolute; top: 5px; transform: translateX(-50%); font: 600 .78rem var(--f-body); color: var(--muted); white-space: nowrap; }
.ch-xa span:first-child { transform: none; } .ch-xa span:last-child:not(:first-child) { transform: translateX(-100%); }
.ch-empty { margin: 8px 0 2px; color: var(--muted); font-size: .9rem; }
.ctab { background: #0c1117; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }

</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <h1>Gushers <span style="color:var(--gold)">Picks</span></h1>
    <div class="nav2" role="group" aria-label="Sections">
      <button type="button" id="nav-home" aria-pressed="true">Top Picks</button>
      <button type="button" id="myplays" aria-pressed="false">My Plays</button>
    </div>
    <div class="lbl">Matchups by league</div>
    <div class="tabs" role="group" aria-label="League">
      <button type="button" data-lg="cfb" aria-pressed="false">College FB</button>
      <button type="button" data-lg="nfl" aria-pressed="false">NFL</button>
      <button type="button" data-lg="nba" aria-pressed="false">NBA</button>
      <button type="button" data-lg="cbb" aria-pressed="false">College BB</button>
    </div>
    <div class="views" id="views" role="group" aria-label="View" hidden>
      <button type="button" id="v-games" aria-pressed="true">Matchups</button>
      <button type="button" id="v-props" aria-pressed="false">Player Props</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Find a team or player" aria-label="Find a team or player">
    <small class="live-at" id="live-at" aria-live="polite"></small>
    <div class="games" id="games"></div>
  </aside>
  <section class="board" id="board" aria-live="polite"></section>
</div>
<div class="foot" id="foot"></div>
<div class="toast" id="toast" hidden></div>

<script id="data" type="application/json">__DATA__</script>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dash = '<span class="dash">—</span>';
const LEAGUES = {
  cfb: { name: 'College Football', short: 'CFB', sport: 'fb', n: 'FBS' },
  nfl: { name: 'NFL', short: 'NFL', sport: 'fb', n: 'NFL', cats: ['Passing', 'Rushing', 'Receiving', 'Receptions', 'Rush + Rec', 'Touchdowns'] },
  nba: { name: 'NBA', short: 'NBA', sport: 'bb', n: 'NBA', cats: ['Points', 'Rebounds', 'Assists', 'PRA', 'Pts+Reb', 'Pts+Ast', 'Reb+Ast', '3PT Made'] },
  cbb: { name: 'College Basketball', short: 'CBB', sport: 'bb', n: 'D-I' },
};
// Final-stat lookups for grading saved player props (mirror the build script's categories).
const PROPVAL = {
  'Passing': p => p.passYds, 'Rushing': p => p.rushYds, 'Receiving': p => p.recYds, 'Receptions': p => p.rec,
  'Rush + Rec': p => (p.rushYds || 0) + (p.recYds || 0), 'Touchdowns': p => (p.rushTD || 0) + (p.recTD || 0),
  'Sacks': p => p.sacks, 'Tackles + Ast': p => p.tackles, 'FG Made': p => p.fg,
  'Points': p => p.pts, 'Rebounds': p => p.reb, 'Assists': p => p.ast, 'PRA': p => p.pts + p.reb + p.ast,
  'Pts+Reb': p => p.pts + p.reb, 'Pts+Ast': p => p.pts + p.ast, 'Reb+Ast': p => p.reb + p.ast,
  '3PT Made': p => p.tpm, 'Blk+Stl': p => p.stl + p.blk,
};
let league = 'cfb', mode = 'games', current = {}, cat = { nfl: 'Passing', nba: 'Points' }, pgame = 'all';

const ord = n => n == null ? '—' : n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const tl = t => (t.rank ? '#' + t.rank + ' ' : '') + t.name;
const fmt = (v, kind) => v == null ? dash : kind === 'pct' ? v.toFixed(1) + '%' : v.toFixed(Math.abs(v) < 10 ? 2 : 1);
function rankClass(r) {
  if (r == null) return '';
  const q = r / DATA[league + '_meta'].teams;
  return q <= 0.33 ? 'g' : q <= 0.5 ? 'y' : q <= 0.67 ? 'o' : 'rd';
}
const mcls = m => m == null ? '' : m >= 6.7 ? 'g' : m >= 5 ? 'y' : m >= 3.3 ? 'o' : 'rd';
// Team logos from ESPN's image library (pro teams by abbreviation, college by team id). If an image can't load,
// the old colored box with the abbreviation shows instead.
const LOGO_LG = { nfl: 'nfl', nba: 'nba', cfb: 'ncaa', cbb: 'ncaa' };
const logoSrc = (t, lg = league) => LOGO_LG[lg] === 'ncaa' ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${encodeURIComponent(t.id)}.png`
  : `https://a.espncdn.com/i/teamlogos/${LOGO_LG[lg]}/500/${encodeURIComponent(String(t.abbr || '').toLowerCase())}.png`;
const LOGO_ERR = `this.parentNode.classList.remove('has-img');this.remove()`;
const mini = (t, lg = league) => t ? `<img class="tlogo" src="${logoSrc(t, lg)}" alt="" loading="lazy" onerror="this.remove()">` : '';
const logo = t => `<div class="logo has-img" style="background:${esc(t.color)};color:${esc(t.alt)}"><img src="${logoSrc(t)}" alt="${esc(t.abbr)}" onerror="${LOGO_ERR}"><span>${esc(t.abbr)}</span></div>`;
const badge = t => `<span class="adv has-img" style="background:${esc(t.color)};color:${esc(t.alt)}" title="${esc(t.name)}"><img src="${logoSrc(t)}" alt="${esc(t.abbr)}" loading="lazy" onerror="${LOGO_ERR}"><b>${esc(t.abbr.slice(0, 4))}</b></span>`;
function toast(text) { const el = $('toast'); el.textContent = text; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
const findGame = (lg, id) => (DATA[lg] || []).find(g => g.id === id);

/* ---------------- matchup board ---------------- */
function teamBlock(t, side) {
  const res = t.last5.map(([o, s, r]) => `<div class="res"><span>${esc(o)}</span><b class="${esc(r)}">${esc(s)}</b></div>`).join('');
  const meta = `<div class="kv"><span>Overall</span><b>${esc(t.overall)}</b></div><div class="kv"><span>Streak</span><b>${esc(t.streak || '—')}</b></div><div class="kv"><span>Rest</span><b>${t.rest ?? '—'}</b></div>`;
  return `<div class="team ${side}">${logo(t)}<div><div class="tname">${esc(tl(t))}</div>
    <div class="tmeta">${meta}${res ? `<span class="sep"></span>${res}` : ''}</div></div></div>`;
}

function section(g, L, R, sec) {
  const bb = LEAGUES[league].sport === 'bb';
  const c = bb ? ['Season', 'Last 10', 'Last 5', 'L5 Rank'] : ['Season', '1st Half', 'Last 3', 'L3 Rank'];
  const rows = sec.rows.map(([name, a, b, kind]) => {
    const ra = a[4], rb = b[0];
    const adv = ra != null && rb != null && ra !== rb ? badge(ra < rb ? L : R) : dash;
    return `<tr><td class="stat l">${esc(name)}</td><td>${fmt(a[0], kind)}</td><td>${fmt(a[1], kind)}</td><td>${fmt(a[2], kind)}</td><td>${fmt(a[3], kind)}</td>
      <td class="rank ${rankClass(ra)}">${ra ?? dash}</td><td>${adv}</td>
      <td class="rank ${rankClass(rb)}">${rb ?? dash}</td><td>${fmt(b[1], kind)}</td><td>${fmt(b[2], kind)}</td><td>${fmt(b[3], kind)}</td><td>${fmt(b[4], kind)}</td>
      <td class="stat r">${esc(name)}</td></tr>`;
  }).join('');
  const ball = bb ? '<span class="ball" style="border-radius:50%;width:15px;height:15px;transform:none"></span>' : '<span class="ball"></span>';
  const head = sec.single
    ? `<div class="sect single"><h2>${ball}${esc(sec.title)}</h2></div>`
    : `<div class="sect"><h2>${ball}${esc(tl(L))} ${esc(sec.title)}</h2><h2>${esc(tl(R))} ${esc(sec.title)}${ball}</h2></div>`;
  return `${head}<table><thead><tr><th style="text-align:right">Statistic</th><th>${c[0]}</th><th>Away</th><th>${c[1]}</th><th>${c[2]}</th><th>${c[3]}</th><th>Adv</th>
    <th>${c[3]}</th><th>${c[2]}</th><th>${c[1]}</th><th>Home</th><th>${c[0]}</th><th style="text-align:left">Statistic</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function modelText(g, L, R) {
  const m = g.model;
  if (!m) return '';
  const fav = m.home >= m.away ? R : L, by = Math.abs(m.home - m.away);
  // The picks come from the stat matchup; the price model is a second opinion. Say plainly whether they agree.
  const pk = g.pick || {}, lines = [];
  const size = v => v === 'Take large' ? 'it stays a large bet' : v === 'Take' ? 'it is still a full bet' : v === 'Take small' ? 'it is a small bet instead of a full one' : 'it stays a Lean, not a bet';
  const says = {
    spread: `${esc(fav.name)} by ${by.toFixed(1)}`,
    total: `${(m.away + m.home).toFixed(1)} total points`,
    moneyline: `${esc(R.name)} winning ${(m.pHome * 100).toFixed(0)}% of the time`,
  };
  const lean = { spread: m.spreadSide, total: m.totalSide, moneyline: m.mlSide };
  for (const [kind, nm] of [['spread', 'Spread'], ['total', 'Total'], ['moneyline', 'Moneyline']]) {
    const p = pk[kind], c = (g.confidence || {})[kind];
    if (!p || !c || c[0] < 4) continue;  // only explain picks that are Leans or bets
    const v = (analyze(league, g, kind) || {}).verdict;
    if (!p.valueSide || (p.value || 0) < 0.5) lines.push(`<b>${nm}:</b> the price model is close to the line here (it projects ${says[kind]}), so the stats decide ${esc(p.call)}.`);
    else if (p.valueSide === p.side) lines.push(`<b>${nm}:</b> the price model agrees with ${esc(p.call)} (it projects ${says[kind]}).`);
    else if ((p.value || 0) >= 0.5) lines.push(`<b>${nm}:</b> the stats and the price model disagree. The stats favor ${esc(p.call)}; the price model projects ${says[kind]}, which leans ${esc(lean[kind] || 'the other way')}. The stats lead, so ${size(v)}.`);
  }
  return `<div class="model"><b>Price model (second opinion):</b> ${esc(L.name)} ${m.away}, ${esc(R.name)} ${m.home}
    (${esc(fav.name)} by ${by.toFixed(1)}, total ${(m.away + m.home).toFixed(1)}; ${esc(R.name)} wins ${(m.pHome * 100).toFixed(0)}% of the time), from team ratings fit to every score this season${m.trust != null ? `, counted ${Math.round(m.trust * 100)}% against the line with this many games played` : ''}.
    ${lines.length ? '<br>' + lines.join('<br>') : ''}</div>`;
}

function confCell(g, kind, label, c) {
  const [score, call] = c;
  const cls = score >= 7 ? 'c-hi' : score >= 4 ? 'c-md' : shown(score, kind, league, g) >= 4 ? 'c-pass' : 'c-lo';  // Pass: orange when the shown score is 4+, red below
  const canAdd = g.state === 'pre' && g.model && (kind !== 'moneyline' || g.model.mlSide) && (kind !== 'spread' || g.model.spreadSide) && (kind !== 'total' || g.model.totalSide);
  const an = score >= 4 ? analyze(league, g, kind) : null;
  const pk = (g.pick || {})[kind], sideName = sd => sd === 'over' ? 'Over' : sd === 'under' ? 'Under' : sd ? g[sd].abbr : '';
  const parts = pk ? `<small class="cparts">Stats ${pk.stat != null ? pk.stat.toFixed(1) + ' ' + sideName(pk.statSide) : '—'} · Price ${pk.value.toFixed(1)}${pk.value >= 0.5 && pk.valueSide ? (pk.valueSide === pk.side ? ' agrees' : ' disagrees') : ''}${pk.tooShort ? ' · price too short to bet (−1000 or more)' : ''}${pk.cal && Math.abs(pk.cal - 1) >= 0.01 ? ` · Calibrated ×${pk.cal.toFixed(2)}` : ''}</small>` : '';
  return `<div><span>${label}</span><b class="${cls}">${shown(score, kind, league, g).toFixed(1)}</b><em class="${cls}">${esc(call)}</em>${an ? vchip(an.verdict) : ''}${parts}${canAdd ? `<button type="button" class="add" data-add="${kind}" data-g="${esc(g.id)}">+ Track</button>` : ''}</div>`;
}

function lineCell(label, cur, open, kal) {
  const moved = open && cur && String(open).replace('+', '') !== String(cur).replace('+', '').replace('PK', '0');
  const sub = [moved ? `Open ${esc(open)}` : '', kal && kal.odds ? `Kalshi ${kal.label ? kal.label + ' ' : ''}${Math.round(kal.p * 100)}% (${esc(kal.odds)})` : ''].filter(Boolean).join(' · ');
  return `<div class="lc"><span>${esc(label)}</span><b>${esc(cur)}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
}
const stripVal = (v, L, R) => Array.isArray(v) ? `${esc(L.abbr)} ${ord(v[0])} / ${esc(R.abbr)} ${ord(v[1])}` : esc(v);

// Betting trends: each team's record against the spread and on totals from closing DraftKings lines.
function trends(g, L, R) {
  const a = L.bet, b = R.bet;
  const n = r => r ? r[0] + r[1] + r[2] : 0;
  if (!a || !b || (!n(a.ats) && !n(b.ats) && !n(a.ou) && !n(b.ou))) return '';
  const hv = x => g.neutral ? '' : x;
  const rec = r => r && r[0] + r[1] + r[2] ? `${r[0]}-${r[1]}${r[2] ? '-' + r[2] : ''}` : dash;
  const pct = r => r && r[0] + r[1] ? Math.round(100 * r[0] / (r[0] + r[1])) + '%' : '';
  const sp = pnum0(g.lines.spreadNum), favL = sp != null && sp > 0, favR = sp != null && sp < 0;
  const rows = [
    ['ATS', 'ats', 'ats'], ['ATS Home', 'atsHome', 'atsHome', hv('R')], ['ATS Away', 'atsAway', 'atsAway', hv('L')],
    ['ATS as Favorite', 'atsFav', 'atsFav', favL && favR ? '' : favL ? 'L' : favR ? 'R' : ''], ['ATS as Underdog', 'atsDog', 'atsDog', favL ? 'R' : favR ? 'L' : ''],
    ['Over-Under', 'ou', 'ou'], ['O/U Home', 'ouHome', 'ouHome', hv('R')], ['O/U Away', 'ouAway', 'ouAway', hv('L')]];
  const lastc = l => (l || []).map(x => `<i class="t${x}">${x}</i>`).join('') || dash;
  const body = rows.map(([n, ka, kb, hl]) => `<tr><td class="${hl === 'L' ? 'now' : ''}"><b>${rec(a[ka])}</b> <small>${pct(a[ka])}</small></td><td class="stat">${esc(n)}</td><td class="${hl === 'R' ? 'now' : ''}"><b>${rec(b[kb])}</b> <small>${pct(b[kb])}</small></td></tr>`).join('')
    + `<tr><td><b class="${a.cover > 0 ? 'pos' : a.cover < 0 ? 'neg' : ''}">${a.cover == null ? dash : (a.cover > 0 ? '+' : '') + a.cover}</b></td><td class="stat">Avg cover margin</td><td><b class="${b.cover > 0 ? 'pos' : b.cover < 0 ? 'neg' : ''}">${b.cover == null ? dash : (b.cover > 0 ? '+' : '') + b.cover}</b></td></tr>`
    + `<tr><td><span class="l5">${lastc(a.last5)}</span></td><td class="stat">Last 5 ATS</td><td><span class="l5">${lastc(b.last5)}</span></td></tr>`;
  return `<div class="trendw"><div class="sect single"><h2><span class="ball"></span>Betting Trends</h2></div>
    <table class="trend"><colgroup><col style="width:35%"><col style="width:30%"><col style="width:35%"></colgroup><thead><tr><th>${esc(tl(L))}</th><th></th><th>${esc(tl(R))}</th></tr></thead><tbody>${body}</tbody></table>
    <p class="tnote">From each finished game's closing DraftKings line. Highlighted rows apply to this game. ATS = against the spread; O/U records are overs-unders-pushes.</p></div>`;
}
const pnum0 = v => v == null || v === '' ? null : +v;

function bannerHtml(g) {
  const L = g.away, R = g.home;
  if (g.state === 'in') return `<div class="banner" data-live="${esc(g.id)}">Live · ${esc(L.abbr)} ${esc(g.score.away)} – ${esc(R.abbr)} ${esc(g.score.home)} · ${esc(g.score.detail)} · ${g.frozen || g.liveOnly ? 'pregame lines and picks, locked at kickoff' : 'lines may be live, not pregame'}</div>`;
  if (g.state === 'post') return `<div class="banner post" data-live="${esc(g.id)}">${esc(g.score.detail)} · ${esc(L.abbr)} ${esc(g.score.away)} – ${esc(R.abbr)} ${esc(g.score.home)}${g.frozen || g.liveOnly ? ' · pregame lines and picks shown' : ''}</div>`;
  return '';
}
function stHtml(g) {
  return g.state === 'in' ? `<span class="st live">Live ${esc(g.score.away)}-${esc(g.score.home)}</span>`
    : g.state === 'post' ? `<span class="st">Final ${esc(g.score.away)}-${esc(g.score.home)}</span>`
    : `<span class="st">${esc(g.date.split(' · ')[1].replace(' ET', ''))}</span>`;
}
function render(g) {
  current[league] = g.id;
  const L = g.away, R = g.home, c = g.confidence, ln = g.lines, op = ln.open || {}, k = g.kalshi || {};
  let banner = bannerHtml(g);
  const strip = g.strip || [['Date / Time', g.date], ['Location', g.location + (g.neutral ? ' (neutral)' : '')], ['Weather', g.weather], ['Surface', g.surface],
    ['Off Rank', g.offRank], ['Def Rank', g.defRank], ['Overall Rank', g.overallRank]];
  if (!g.model && g.state === 'pre') {
    const played = (g.sections || []).some(s => s.rows.some(r => r[1] && r[1][0] != null || r[2] && r[2][4] != null));
    banner += `<div class="banner post">${played ? 'Early season: stats are in, but confidence scores and picks wait until both teams have played 3 games.' : 'These teams haven\'t played a game this season yet, so stats and model picks fill in after their first games.'}</div>`;
  }
  const np = LEAGUES[league].cats && g.state === 'pre' ? (g.props || []).filter(p => p.line != null).length : 0;
  const gbar = LEAGUES[league].cats ? `<div class="gbar"><button type="button" class="on" aria-pressed="true">Matchup board</button><button type="button" id="to-props" ${np ? '' : 'disabled'}>Player props for this game <small>${np ? np + ' props' : g.state === 'pre' ? 'none posted yet' : 'game started'}</small> →</button></div>` : '';
  $('board').innerHTML = `${gbar}${banner}<div class="scroll"><div class="inner">
    <div class="teams">${teamBlock(L, 'home')}${teamBlock(R, 'away')}</div>
    <div class="strip" style="grid-template-columns:repeat(${strip.length}, minmax(0, 1fr))">${strip.map(([k, v]) => `<div><span>${esc(k)}</span><b>${stripVal(v, L, R)}</b></div>`).join('')}</div>
    <div class="lines">
      ${lineCell(`${L.abbr} Line`, ln.awaySpread, op.awaySpread, k.spread?.away)}
      ${lineCell(`${L.abbr} ML`, ln.awayML, op.awayML, k.ml?.away)}
      ${lineCell('Total', ln.total, op.total, k.total ? { p: k.total.over.p, odds: k.total.over.odds, label: 'Over' } : null)}
      ${lineCell(`${R.abbr} ML`, ln.homeML, op.homeML, k.ml?.home)}
      ${lineCell(`${R.abbr} Line`, ln.homeSpread, op.homeSpread, k.spread?.home)}
    </div>
    ${g.sections.map(s => section(g, L, R, s)).join('')}
    ${trends(g, L, R)}
    ${c ? `<div class="conf-h"><span><span class="ball"></span>Statistical Confidence Levels</span><small>Model ratings · lines from ${esc(ln.book || 'ESPN')}</small></div>
    <div class="conf">${confCell(g, 'moneyline', 'Moneyline', c.moneyline)}${confCell(g, 'spread', 'Spread', c.spread)}${confCell(g, 'total', 'Total', c.total)}</div>` : ''}
    ${modelText(g, L, R)}
    ${breakdown(league, g)}
    ${dataCheck(g)}
  </div></div>`;
  $('board').querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAdd(fromGame(findGame(league, b.dataset.g), b.dataset.add)));
  document.querySelectorAll('.game-btn').forEach(b => b.setAttribute('aria-current', b.dataset.id === g.id));
  const tp = $('to-props'); if (tp) tp.onclick = () => { pgame = g.id; setMode('props'); };
}

function picks(g) {
  if (!g.confidence) return '';
  // Only picks the model says to take (Take large, Take or Take small); Leans it fades and Passes get no chip.
  return ['moneyline', 'spread', 'total'].filter(k => { const v = (analyze(league, g, k) || {}).verdict; return /^Take/.test(v || ''); })
    .map(k => g.confidence[k]).map(([s, t]) => `<span class="pk ${s >= 7 ? '' : 'lean'}">${esc(t)}</span>`).join('');
}

let showDone = false;
function list() {
  const games = DATA[league] || [];
  const q = $('q').value.trim().toLowerCase();
  const shown = games.filter(g => !q || [g.away.name, g.home.name, g.away.full, g.home.full, g.away.abbr, g.home.abbr].join(' ').toLowerCase().includes(q));
  const order = { in: 0, pre: 1, post: 2 };
  const active = shown.filter(g => g.state !== 'post'), done = shown.filter(g => g.state === 'post');
  const item = g => {
    const st = stHtml(g);
    return `<button type="button" class="game-btn" data-id="${esc(g.id)}"><span class="gtop"><span>${mini(g.away)}${esc(tl(g.away))} @ ${mini(g.home)}${esc(tl(g.home))}</span>${st}</span>
      <small>${esc(g.home.abbr)} ${esc(g.lines.homeSpread)} · O/U ${esc(g.lines.total)}${(g.check || []).some(x => !x.ok) ? ' · <span class="warn-t">⚠ data</span>' : (g.check || []).length ? ' · ✓ checked' : ''}</small>${g.state === 'pre' ? `<span class="picks">${picks(g)}</span>` : ''}</button>`;
  };
  let html = '', day = '';
  for (const g of [...active].sort((a, b) => order[a.state] - order[b.state])) {
    const d = g.state === 'in' ? 'Live now' : g.date.split(' · ')[0];
    if (d !== day) { day = d; html += `<div class="day">${esc(d)}</div>`; }
    html += item(g);
  }
  if (done.length) {
    html += `<button type="button" class="done-btn" id="done-btn">${showDone ? 'Hide' : 'Show'} ${done.length} finished game${done.length > 1 ? 's' : ''}</button>`;
    if (showDone) html += `<div class="day">Finished</div>` + done.map(item).join('');
  }
  const off = league === 'cbb' ? 'College basketball tips off November 3. Games show up here once they are on the schedule and have betting lines.' : 'No games today.';
  $('games').innerHTML = html || `<p class="empty">${q ? 'No games match that search.' : off}</p>`;
  $('games').querySelectorAll('.game-btn').forEach(b => b.onclick = () => render(games.find(g => g.id === b.dataset.id)));
  if ($('done-btn')) $('done-btn').onclick = () => { showDone = !showDone; list(); };
  const pick = games.find(g => g.id === current[league]) || active.find(g => g.state === 'pre') || active[0] || shown[0];

// Columns per prop type: [label, value(g), main?]. g(f) reads a field from the player's game-log row.
const lpct = (a, b) => b ? Math.round(1000 * a / b) / 10 : null;
const lsum = (...xs) => xs.every(x => x == null) ? null : xs.reduce((t, x) => t + (x || 0), 0);
const LOGCOLS = {
  Points: [['PTS', g => g('pts'), 1], ['FGA', g => g('fga')], ['3PM', g => g('tpm')], ['FTA', g => g('fta')], ['FG%', g => lpct(g('fgm'), g('fga'))], ['MIN', g => g('min')]],

  PRA: [['PRA', g => lsum(g('pts'), g('reb'), g('ast')), 1], ['PTS', g => g('pts')], ['REB', g => g('reb')], ['AST', g => g('ast')], ['MIN', g => g('min')]],
  'Pts+Reb': [['P+R', g => lsum(g('pts'), g('reb')), 1], ['PTS', g => g('pts')], ['REB', g => g('reb')], ['FGA', g => g('fga')], ['MIN', g => g('min')]],
  'Pts+Ast': [['P+A', g => lsum(g('pts'), g('ast')), 1], ['PTS', g => g('pts')], ['AST', g => g('ast')], ['FGA', g => g('fga')], ['MIN', g => g('min')]],
  'Reb+Ast': [['R+A', g => lsum(g('reb'), g('ast')), 1], ['REB', g => g('reb')], ['AST', g => g('ast')], ['PTS', g => g('pts')], ['MIN', g => g('min')]],
  '3PT Made': [['3PM', g => g('tpm'), 1], ['3PA', g => g('tpa')], ['3P%', g => lpct(g('tpm'), g('tpa'))], ['FGA', g => g('fga')], ['PTS', g => g('pts')], ['MIN', g => g('min')]],
  Passing: [['YDS', g => g('passYds'), 1], ['CMP', g => g('cmp')], ['ATT', g => g('passAtt')], ['CMP%', g => lpct(g('cmp'), g('passAtt'))], ['TD', g => g('passTD')], ['INT', g => g('int')], ['RUSH YDS', g => g('rushYds')]],
  Rushing: [['YDS', g => g('rushYds'), 1], ['CAR', g => g('car')], ['YPC', g => g('car') ? Math.round(10 * (g('rushYds') || 0) / g('car')) / 10 : null], ['TD', g => g('rushTD')], ['LONG', g => g('rushLong')], ['REC YDS', g => g('recYds')]],
  Receiving: [['YDS', g => g('recYds'), 1], ['REC', g => g('rec')], ['TGT', g => g('tgt')], ['YPR', g => g('rec') ? Math.round(10 * (g('recYds') || 0) / g('rec')) / 10 : null], ['TD', g => g('recTD')], ['LONG', g => g('recLong')]],
  Receptions: [['REC', g => g('rec'), 1], ['TGT', g => g('tgt')], ['CATCH%', g => lpct(g('rec'), g('tgt'))], ['YDS', g => g('recYds')], ['TD', g => g('recTD')]],
  'Rush + Rec': [['YDS', g => lsum(g('rushYds'), g('recYds')), 1], ['RUSH YDS', g => g('rushYds')], ['REC YDS', g => g('recYds')], ['CAR', g => g('car')], ['REC', g => g('rec')], ['TD', g => lsum(g('rushTD'), g('recTD'))]],
  Touchdowns: [['TD', g => lsum(g('rushTD'), g('recTD')), 1], ['RUSH TD', g => g('rushTD')], ['REC TD', g => g('recTD')], ['CAR', g => g('car')], ['TGT', g => g('tgt')], ['YDS', g => lsum(g('rushYds'), g('recYds'))]],
};
function logTable(p) {
  const sp = LEAGUES[league].sport, F = (DATA.logFields || {})[sp] || [], rows = ((DATA.logs || {})[sp] || {})[p.pid] || [];
  const cols = LOGCOLS[p.cat];
  if (!cols || !rows.length) return '<div class="plog"><small>No game log for this player yet.</small></div>';
  const vals = rows.map(r => { const g = f => { const i = F.indexOf(f); return i < 0 ? null : r[i + 2]; }; return cols.map(([, fn]) => fn(g)); });
  const under = p.side === 'Under', beat = v => v != null && p.line != null && (under ? v < p.line : v > p.line);
  const fmt = v => v == null ? '–' : Number.isInteger(v) ? String(v) : v.toFixed(1);
  const avg = cols.map((_, j) => { const xs = vals.map(v => v[j]).filter(x => x != null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; });
  const head = `<tr><th>Date</th><th>Opp</th>${cols.map(([l]) => `<th>${esc(l)}</th>`).join('')}</tr>`;
  const body = rows.map((r, i) => `<tr><td class="dim">${esc(r[0])}</td><td>${esc(r[1])}</td>${cols.map(([, , main], j) => `<td class="${main ? 'main' + (beat(vals[i][j]) ? ' g' : '') : ''}">${fmt(vals[i][j])}</td>`).join('')}</tr>`).join('');
  const foot = `<tr class="avg"><td>AVG</td><td class="dim">${rows.length} GP</td>${avg.map((v, j) => `<td class="${cols[j][2] ? 'main' + (beat(v) ? ' g' : '') : ''}">${v == null ? '–' : v.toFixed(1)}</td>`).join('')}</tr>`;
  return `<div class="plog"><table><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>`;
}

function todayET() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); }
function shiftDay(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const prettyDay = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' });
const priceNum = p => typeof p === 'number' ? p : parseFloat(String(p).replace('+', ''));
const toDec = a => a > 0 ? 1 + a / 100 : 1 + 100 / -a;
const toAm = d => d >= 2 ? '+' + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1)));
function unitsOf(p) {
  const pr = priceNum(p.price), st = +p.stake || 1;
  if (p.result === 'W') return st * (pr > 0 ? pr / 100 : 100 / -pr);
  if (p.result === 'L') return -st;

}
function gameDay(g) {
  const m = g.date.match(/^(\w+) (\d+)/);
  const months = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
  const now = new Date(), y = now.getUTCFullYear();
  const d = new Date(Date.UTC(months[m[1]] < 6 && now.getUTCMonth() > 8 ? y + 1 : y, months[m[1]], +m[2]));

}
const gameTime = g => g.date.split(' · ')[1]?.replace(' ET', '') || '';
function fromGame(g, kind, lg = league) {
  const league = lg;
  const pk = (g.pick || {})[kind];
  const m = pk ? { mlSide: pk.call, spreadSide: pk.call, totalSide: pk.call } : g.model;
  const ln = g.lines, base = { date: gameDay(g), time: gameTime(g), league: league, matchup: `${g.away.abbr} @ ${g.home.abbr}`, book: 'DK', stake: ({ 'Take large': 2, 'Take small': 0.5 })[(analyze(league, g, kind) || {}).verdict] || 1 };
  if (kind === 'moneyline') {
    const side = m.mlSide.startsWith(g.home.abbr + ' ') ? 'home' : 'away';

  }
  if (kind === 'spread') {

      ${r.wrong.length || r.misses.length ? `<div><h4 class="neg">What went wrong</h4>${r.wrong.length ? `<ul>${li(r.wrong)}</ul>` : ''}${r.misses.length ? `<p class="rc-sub">Biggest misses</p><ul>${li(r.misses)}</ul>` : ''}</div>` : ''}
      ${r.right.length || r.hits.length ? `<div><h4 class="pos">What worked</h4>${r.right.length ? `<ul>${li(r.right)}</ul>` : ''}${r.hits.length ? `<p class="rc-sub">Best hits</p><ul>${li(r.hits)}</ul>` : ''}</div>` : ''}
      <div><h4>What the model is adjusting</h4>${(r.plan || []).length ? `<ul>${li(r.plan)}</ul>` : ''}${r.calibration.length ? `<p class="rc-sub">By bet type</p><ul>${li(r.calibration)}</ul>` : `<p>${esc(r.note)}</p>`}</div>
    </div></details>` + `<details class="how"><summary>How results change future confidence</summary><p>After every refresh, each sport and bet type (CFB spreads, NBA totals, and so on) is checked against all of its graded picks so far, Takes and faded Leans alike, at the price they were logged. If that group is winning units, its future scores are scaled up a little; if it is losing units, they are scaled down. The multiplier starts once a group has 12 graded picks, moves slowly (a group needs about 30 picks before results count half), and stays between ×0.80 and ×1.15, so one bad night can't swing the model but a pattern over weeks will. A ×0.94 on CFB spreads turns a 7.0 into 6.6: borderline Plays drop to Leans, borderline Leans fall to Pass, and fewer of those picks get logged as Takes. It shows on each confidence box as Calibrated ×0.94. Not every game gets a pick: Leans need 6.5+ to become a Take. The record in each recap is Takes on spreads, totals and props.</p></details>`;
}

const saveSettings = () => db.doc('plays/_settings').set({ unitSize: unitSize || null, bankroll: bank.bankroll, bankPct: bank.pct, bankSince: bank.since });

// Bankroll tab: a separate view. Suggests a unit from the bankroll and shows how much of it today's bets put at risk.
function renderBank() {
  const today = todayET(), U = UNIT();
  const settled = plays.filter(p => p.result && bank.since && p.date >= bank.since);
  const current = bank.bankroll ? bank.bankroll + settled.reduce((s, p) => s + unitsOf(p), 0) * U : null;
  const unit = current ? Math.max(1, Math.round(current * bank.pct) / 100) : null;
  const mineOpen = plays.filter(p => !p.result && p.date === today).reduce((s, p) => s + (+p.stake || 1), 0);
  const modelOpen = (DATA.modelHistory || []).filter(p => p.date === today && !p.result && /^Take/.test(p.verdict || '') && p.grade?.kind !== 'ml')
    .reduce((s, p) => s + (+p.stake || 1), 0);
  const pct = d => current ? (100 * d / current) : 0;
  const warn = d => pct(d) > 10 ? '<b class="neg"> · over 10% of your bankroll</b>' : '';
  const tabs = `<div class="srctabs" role="tablist" aria-label="Whose plays">${[['model', 'Model picks'], ['mine', 'My plays'], ['bank', 'Bankroll']].map(([k, n]) =>
    `<button type="button" role="tab" data-src="${k}" aria-selected="${src === k}"><span>${n}</span></button>`).join('')}</div>`;
  $('board').innerHTML = `<div class="plays"><div class="ph">${tabs}</div>
    <div class="bankv">
      <p class="msg">Optional. Enter your bankroll and the board suggests a unit size and shows how much of it today's bets put at risk. Nothing else on the board changes.</p>
      <div class="bank-in">
        <label>Bankroll $<input id="b-roll" type="number" min="1" step="1" inputmode="decimal" value="${bank.bankroll || ''}" placeholder="e.g. 1000"></label>
        <div class="seg" role="group" aria-label="Unit size">${[1, 1.5, 2].map(x => `<button type="button" data-bpct="${x}" aria-pressed="${bank.pct === x}">${x}% per unit</button>`).join('')}</div>
      </div>
      ${current ? `<div class="sumbar">
        <div class="big"><span>Bankroll now</span><b>${money(current, false)}</b><small>${money(bank.bankroll, false)} start${bank.since ? ' · since ' + esc(bank.since) : ''} · ${money(current - bank.bankroll)} from My plays</small></div>
        <div><span>Suggested unit</span><b>${money(unit, false)}</b><small>${bank.pct}% of the bankroll${Math.abs(unit - U) >= 0.5 ? ` · your unit is ${money(U, false)}` : ' · matches your unit'}</small>
          ${Math.abs(unit - U) >= 0.5 ? '<button type="button" class="pbtn primary" id="b-use">Use as my unit</button>' : ''}</div>
        <div><span>My open plays today</span><b>${money(mineOpen * U, false)}</b><small>${mineOpen.toFixed(1)}u · ${pct(mineOpen * U).toFixed(1)}% of bankroll${warn(mineOpen * U)}</small></div>
        <div><span>Model card today</span><b>${money(modelOpen * unit, false)}</b><small>${modelOpen.toFixed(1)}u at the suggested unit · ${pct(modelOpen * unit).toFixed(1)}%${warn(modelOpen * unit)}</small></div>
      </div>
      <p class="pnote">A unit of 1-2% of your bankroll lets a bad week cost a few percent, not the bankroll. If a day's bets add up to more than about 10% of it, consider betting only the strongest (the Most confident list on Top Picks) or smaller stakes.</p>` : ''}
    </div></div>`;
  $('board').querySelectorAll('[data-src]').forEach(b => b.onclick = () => { src = b.dataset.src; confirmDel = null; renderPlays(); });
  const persist = async () => { renderBank(); if (db) { try { await saveSettings(); } catch (e) { toast('Could not save the bankroll.'); } } };
  $('b-roll').onchange = e => { const v = Math.round(parseFloat(e.target.value) * 100) / 100;
    if (!(v > 0)) { toast('Enter a bankroll above $0.'); return; }
    bank.bankroll = v; bank.since = todayET(); setTimeout(persist, 0); };
  $('board').querySelectorAll('[data-bpct]').forEach(b => b.onclick = () => { bank.pct = +b.dataset.bpct; persist(); });
  const use = $('b-use'); if (use) use.onclick = () => { unitSize = unit; persist(); toast(`1 unit = ${money(unit, false)}`); };
}

function renderPlays() {
  if (src === 'bank') return renderBank();
  const [from, to] = periodRange(period, pday);
  const inSport = p => psport === 'all' || p.league === psport;
  const scope = SRC[src].list().filter(p => p.date >= from && p.date <= to && inSport(p));
  const s = summary(scope);
  const U = UNIT();
  let body = '';
  if (dbState === 'off') body = `<p class="msg err">Saving plays needs the board opened on claude.ai while you're signed in. Your plays are stored privately with this board, so only you can see them.</p>`;
  else if (dbState === 'loading') body = `<p class="msg">Loading your plays…</p>`;
  else if (dbState === 'slow') body = `<p class="msg err">Your plays can't be reached right now. They'll appear once the connection comes back.</p>`;
  else if (!scope.length) body = `<p class="msg">No plays ${period === 'day' ? 'on this day' : period === 'all' ? 'yet' : 'in this ' + period}. Use + Track on any pick on the board, or Add play to enter one yourself.</p>`;
  else {
    const daily = period !== 'day';
    const groups = {};
    for (const p of [...scope].sort((a, b) => daily ? byWhen(b, a) : byWhen(a, b))) {
      const k = daily ? p.date : p.league;
      (groups[k] = groups[k] || []).push(p);
    }
    body = Object.entries(groups).map(([k, ps]) => {
      const gs = summary(ps);
      const title = daily ? prettyDay(k) : LEAGUES[k]?.short || k;
      const gm = gs.units * U;
      const gk = src + ':' + k;
      const isProp = p => p.grade?.kind === 'prop';
      const row = p => {
        const u = unitsOf(p);
        const pm = isProp(p) ? (p.play || '').match(/^(.*?) ((?:[ou][\d.]+ .+)|anytime TD)$/) : null;
        const ou = pm && /^[ou]/.test(pm[2]) ? (pm[2][0] === 'o' ? '<b class="ou o">O</b> ' : '<b class="ou u">U</b> ') : '';
        if (p.type === 'parlay') {
          const st = l => { const r = l.grade ? gradeOf(l) : null; return r ? `<i class="lr ${r}">${r}</i>` : '<i class="lr">·</i>'; };
          p._play = `<b>${(p.legs || []).length}-leg parlay</b>${(p.legs || []).map(l => `<small class="pl-sub">${st(l)} ${esc(l.play)}${l.matchup ? ` <span class="muted">${esc(l.matchup)}</span>` : ''}</small>`).join('')}`;
        }
        const play = p._play ? p._play : pm ? `<b>${esc(pm[1])}</b><small class="pl-sub">${ou}${esc(pm[2].replace(/^o/, 'Over ').replace(/^u/, 'Under '))}</small>` : esc(p.play);
        const chip = p.verdict === 'Take small' || p.verdict === 'Take large' ? ' ' + vchip(p.verdict) : '';
        return `<tr><td class="mu">${esc(p.time || '')}${daily ? ' ' + esc(LEAGUES[p.league]?.short || '') : ''}</td><td class="mu" title="${esc(p.matchup)}">${esc(p.matchup)}</td><td class="play">${play}</td>
          <td class="num">${esc(priceNum(p.price) > 0 ? '+' + priceNum(p.price) : priceNum(p.price))}</td><td>${esc(p.book)}</td><td class="num">${esc(p.stake)}u <small class="muted">${money((+p.stake || 1) * U, false)}</small></td>
          <td>${src === 'mine' ? `<span class="res3">${['W', 'L', 'P'].map(r => `<button type="button" class="${r} ${p.result === r ? 'on' : ''}" data-res="${r}" data-id="${esc(p.id)}" aria-label="Mark ${r === 'W' ? 'won' : r === 'L' ? 'lost' : 'push'}">${r}</button>`).join('')}</span>` : `<span class="res3">${p.result ? `<button type="button" class="${p.result === 'V' ? 'P' : p.result} on" disabled>${p.result === 'V' ? 'V' : p.result}</button>` : '<span class="dash">pending</span>'}</span>${chip}`}${p.result ? '' : liveBar(p)}</td>
          <td class="num ${u > 0 ? 'pos' : u < 0 ? 'neg' : ''}">${p.result ? usign(u) : dash}</td>
          <td class="num ${u > 0 ? 'pos' : u < 0 ? 'neg' : ''}">${p.result ? money(u * U) : dash}</td>
          <td>${src === 'mine' ? `<button type="button" class="del" data-del="${esc(p.id)}">${confirmDel === p.id ? 'Confirm delete' : 'Delete'}</button>` : ''}</td></tr>`;
      };
      const sect = (label, xs) => {
        if (!xs.length) return '';
        const ss = summary(xs), sm = ss.units * U;
        return `<div class="psec"><div class="psec-h"><span>${label}</span><small>${xs.length} · ${ss.w}-${ss.l}${ss.pu ? '-' + ss.pu : ''}${ss.settledN ? ` · <b class="${sm > 0 ? 'pos' : sm < 0 ? 'neg' : ''}">${money(sm)}</b>` : ''}</small></div>
        <div class="scroll"><table class="ptbl" style="min-width:900px"><thead><tr><th>Time</th><th>Matchup</th><th>${label === 'Player props' ? 'Player' : 'Play'}</th><th>Price</th><th>Book</th><th>Stake</th><th>Result</th><th>Units</th><th>Profit</th><th></th></tr></thead>
        <tbody>${xs.map(row).join('')}</tbody></table></div></div>`;
      };
      const parl = ps.filter(p => p.type === 'parlay');
      const games = ps.filter(p => !isProp(p) && p.type !== 'parlay'), props = ps.filter(p => isProp(p) && p.type !== 'parlay');
      return `<details class="grp" data-gk="${esc(gk)}" ${closedGroups.has(gk) ? '' : 'open'}><summary class="lg-h">${esc(title)}<small>${ps.length} play${ps.length > 1 ? 's' : ''} · ${gs.w}-${gs.l}${gs.pu ? '-' + gs.pu : ''}${gs.settledN ? ` · <span class="${gm > 0 ? 'pos' : gm < 0 ? 'neg' : ''}">${money(gm)}</span>` : ''}</small></summary>
      ${sect(games.some(p => p.grade?.kind === 'ml') ? 'Spreads, totals &amp; moneylines' : 'Spreads &amp; totals', games)}${sect('Player props', props)}${sect('Parlays', parl)}</details>`;
    }).join('');
  }
  const f = draft;
  const legRow = (l, i) => `<div class="leg">${l.grade ? `<span class="leg-lg">${esc(LEAGUES[l.league]?.short || '')}</span>` : `<select id="f-ll-${i}" aria-label="Leg ${i + 1} league">${Object.entries(LEAGUES).map(([k, v]) => `<option value="${k}" ${l.league === k ? 'selected' : ''}>${v.short}</option>`).join('')}</select>`}
      <input id="f-lm-${i}" value="${esc(l.matchup || '')}" placeholder="Matchup" aria-label="Leg ${i + 1} matchup">
      <input id="f-lp-${i}" value="${esc(l.play || '')}" placeholder="Pick" aria-label="Leg ${i + 1} pick" required>
      <input id="f-lo-${i}" value="${esc(l.price > 0 ? '+' + l.price : (l.price ?? ''))}" placeholder="-110" inputmode="numeric" aria-label="Leg ${i + 1} odds" required>
      <button type="button" class="del" data-legdel="${i}" aria-label="Remove leg ${i + 1}">✕</button>${l.grade ? '<small class="leg-auto">grades itself</small>' : ''}</div>`;
  const isParlay = f && f.type === 'parlay';
  const typeSw = f ? `<div class="ptype" role="group" aria-label="Play type"><button type="button" data-ptype="single" aria-pressed="${!isParlay}">Single</button><button type="button" data-ptype="parlay" aria-pressed="${!!isParlay}">Parlay</button></div>` : '';
  const pOdds = f && isParlay ? (f.priceManual ? f.price : parlayPrice(f.legs)) : null;
  const form = isParlay ? `<form class="form" id="addf">${typeSw}
      <div class="legs" style="grid-column:1/-1"><span class="legs-h">Legs</span>${f.legs.map(legRow).join('') || '<p class="msg">No legs yet. Tap + Add leg, or tap + Track on any pick on the board while this form is open.</p>'}
        <button type="button" class="pbtn" id="f-legadd">+ Add leg</button></div>
      <label for="f-date">Date<input id="f-date" type="date" value="${esc(f.date)}" required></label>
      <label for="f-book">Book<input id="f-book" value="${esc(f.book)}"></label>
      <label for="f-stake">Stake (units)<input id="f-stake" type="number" step="0.25" min="0.25" value="${esc(f.stake)}"></label>
      <label for="f-price">Parlay odds<input id="f-price" value="${esc(pOdds == null ? '' : pOdds > 0 ? '+' + pOdds : pOdds)}" inputmode="numeric" placeholder="from the legs" required></label>
      <div class="actions"><button class="save" type="submit">Save parlay</button><button class="pbtn" type="button" id="f-cancel">Cancel</button></div>
      <p class="msg" id="f-msg" style="grid-column:1/-1"><span id="f-risk"></span>Odds fill in from the legs; type your book's price to override. Tracked legs grade themselves; a parlay with a hand-entered leg is graded with the W / L / P buttons. A losing leg loses the parlay, and a pushed leg drops out.</p>
    </form>` : f ? `<form class="form" id="addf">${typeSw}
      <label for="f-date">Date<input id="f-date" type="date" value="${esc(f.date)}" required></label>
      <label for="f-league">League<select id="f-league">${Object.entries(LEAGUES).map(([k, v]) => `<option value="${k}" ${f.league === k ? 'selected' : ''}>${v.short}</option>`).join('')}</select></label>
      <label for="f-time">Time<input id="f-time" value="${esc(f.time)}" placeholder="7:30 PM"></label>
      <label class="wide" for="f-matchup">Matchup<input id="f-matchup" value="${esc(f.matchup)}" placeholder="MIN @ DET" required></label>
      <label class="wide" for="f-play">Play<input id="f-play" value="${esc(f.play)}" placeholder="MIN +3" required></label>
      <label for="f-price">Price<input id="f-price" value="${esc(f.price > 0 ? '+' + f.price : f.price)}" inputmode="numeric" required></label>
      <label for="f-book">Book<input id="f-book" value="${esc(f.book)}"></label>
      <label for="f-stake">Stake (units)<input id="f-stake" type="number" step="0.25" min="0.25" value="${esc(f.stake)}"></label>
      <div class="actions"><button class="save" type="submit">Save play</button><button class="pbtn" type="button" id="f-cancel">Cancel</button></div>
      <p class="msg" id="f-msg" style="grid-column:1/-1"><span id="f-risk"></span>${f.grade ? (f.grade.kind === 'prop' ? 'The price is pre-filled from Kalshi\'s fair odds (or -110 without one); change it to what your book shows. ' : '') + 'This play grades itself once the game is final.' : 'Manual plays are graded with the W / L / P buttons.'}</p>
    </form>` : '';
  const profit = s.units * U;
  const pc = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
  const rec = x => `${x.w}-${x.l}${x.pu ? '-' + x.pu : ''}`;
  const empty = dbState === 'ready' && !scope.length;
  const sportSw = `<div class="sportf" role="group" aria-label="Sport">${[['all', 'All sports'], ...Object.entries(LEAGUES).map(([k, v]) => [k, v.short])].map(([k, n]) => {
      const c = SRC[src].list().filter(p => p.date >= from && p.date <= to && (k === 'all' || p.league === k)).length;
      return `<button type="button" data-sport="${k}" aria-pressed="${psport === k}"${c || k === 'all' || psport === k ? '' : ' class="none"'}>${esc(n)}<small>${c}</small></button>`; }).join('')}</div>`;
  const when = period === 'day' ? 'on ' + periodLabel(period, pday) : period === 'all' ? 'yet' : 'in this ' + period;
  const sportWord = psport === 'all' ? '' : LEAGUES[psport].short + ' ';
  $('board').innerHTML = `<div class="plays">
    <div class="ph">
      <div class="srctabs" role="tablist" aria-label="Whose plays">${[["model", SRC.model], ["mine", SRC.mine]].map(([key, sr]) => { const ss = summary(sr.list().filter(p => p.date >= from && p.date <= to && inSport(p))), v = ss.units * U;
        return `<button type="button" role="tab" data-src="${key}" aria-selected="${src === key}"><span>${key === 'mine' ? 'My plays' : 'Model picks'}</span><b class="${pc(v)}">${ss.n ? money(v) : '—'}</b></button>`; }).join('')}<button type="button" role="tab" data-src="bank" aria-selected="false"><span>Bankroll</span><b>${bank.bankroll ? money(bank.bankroll, false) : 'set'}</b></button></div>

      ${src === 'mine' ? `<button type="button" class="pbtn" id="p-grade" title="Grade finished plays now">Grade</button><button type="button" class="pbtn primary" id="p-add">+ Add play</button><button type="button" class="pbtn parlay" id="p-parlay">+ Add parlay</button>` : ''}
    </div>
    <div class="ptool">
      <div class="seg" role="group" aria-label="Period">${PERIODS.map(([k, v]) => `<button type="button" data-per="${k}" aria-pressed="${period === k}">${v}</button>`).join('')}</div>
      <div class="dnav">${period === 'all' ? '<span class="pdate">All time</span>' : `<button type="button" class="pbtn" id="p-prev" aria-label="Previous ${period}">‹</button>
        <span class="pdate">${esc(periodLabel(period, pday))}</span>
        <button type="button" class="pbtn" id="p-next" aria-label="Next ${period}">›</button>
        <button type="button" class="pbtn" id="p-today">Today</button>`}</div>
      <span class="spacer"></span>
      <label class="unit" for="p-unit" title="${unitSize ? 'What one unit is worth to you' : 'Set what one unit is worth to you (assumes $10 until you do)'}">Unit $<input id="p-unit" type="number" min="1" step="1" value="${esc(U)}" inputmode="decimal"></label>
    </div>
    ${form}
    ${s.settledN ? '' : sportSw}
    ${src === 'model' ? recapCard() : ''}
    ${src === 'model' ? `<details class="how"><summary>How the model picks P&amp;L works</summary><p>What you'd have made betting every green TAKE pick on spreads, totals and props (moneylines aren't counted). Each refresh logs that day's Take picks at the price shown then (1 unit, 2 for a Large bet, half for a Small bet) and grades them from final scores and box scores. Props are priced at Kalshi's fair odds, or -110 without one. A player who doesn't play is a void.</p></details>` : ''}
    ${empty ? `<div class="empty"><b>No ${esc(sportWord)}plays ${esc(when)}</b>
        <p>${src === 'mine' ? 'Tap + Track on any pick on the board, or add a play yourself. Tracked plays grade themselves once the game is final.' : 'The model logs its Take picks each refresh; they show here once they are on the board for this period.'}</p>
        <div class="row">${src === 'mine' ? '<button type="button" class="pbtn primary" id="p-add2">+ Add play</button><button type="button" class="pbtn parlay" id="p-parlay2">+ Add parlay</button>' : ''}<button type="button" class="pbtn" id="p-home">Browse Top Picks</button>${period !== 'all' ? '<button type="button" class="pbtn" id="p-all">See all time</button>' : ''}</div></div>`
    : dbState === 'ready' ? `<div class="sumbar">
        <div class="big"><span>Profit</span><b class="${pc(profit)}">${money(profit)}</b><small>${usign(s.units)}${s.n > s.settledN ? ` · ${s.n - s.settledN} pending` : ''}</small></div>
        <div><span>Record</span><b>${rec(s)}</b><small>${s.n} play${s.n === 1 ? '' : 's'}</small></div>
        <div><span>ROI</span><b class="${pc(s.roi)}">${(s.roi > 0 ? '+' : '') + (s.roi * 100).toFixed(1)}%</b><small>${money(s.staked * U, false)} risked · ${money((s.staked + s.units) * U, false)} returned</small>
          <span class="roi-per">${PERIODS.map(([k, lbl]) => { const [a, b] = periodRange(k, pday);

  wireChart();
  $('board').querySelectorAll('[data-per]').forEach(b => b.onclick = () => { period = b.dataset.per; renderPlays(); });
  $('board').querySelectorAll('[data-sport]').forEach(b => b.onclick = () => { psport = b.dataset.sport; renderPlays(); if (b.classList.contains('spc')) window.scrollTo({ top: 0, behavior: 'smooth' }); });

  $('board').querySelectorAll('[data-rlg]').forEach(b => b.onclick = () => { recapLg = b.dataset.rlg; renderPlays(); });
  $('board').querySelectorAll('details.grp').forEach(d => d.ontoggle = () => { d.open ? closedGroups.delete(d.dataset.gk) : closedGroups.add(d.dataset.gk); });
  $('board').querySelectorAll('[data-src]').forEach(b => b.onclick = () => { src = b.dataset.src; confirmDel = null; renderPlays(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('p-prev', () => { pday = shiftPeriod(period, pday, -1); renderPlays(); });
  on('p-next', () => { pday = shiftPeriod(period, pday, 1); renderPlays(); });
  on('p-today', () => { pday = todayET(); renderPlays(); });
  on('p-home', () => setMode('home'));
  on('p-all', () => { period = 'all'; renderPlays(); });
  $('p-unit').onchange = e => setTimeout(() => saveUnit(e.target), 0);  // redraw after the input finishes losing focus
  const saveUnit = async el => {
    const e = { target: el };
    const v = Math.round(parseFloat(e.target.value) * 100) / 100;
    if (!(v > 0)) { toast('Enter a unit size above $0.'); e.target.value = U; return; }
    unitSize = v; renderPlays();
    if (!db) { toast('Unit size applies for this visit; sign in on claude.ai to save it.'); return; }
    try { await saveSettings(); toast(`1 unit = ${money(v, false)}`); } catch (err) { toast('Could not save the unit size.'); }
  };
  on('p-grade', () => gradeAll(false));
  const addPlay = () => { draft = { date: pday, time: '', league: league, matchup: '', play: '', price: -110, book: 'DK', stake: 1 }; renderPlays(); };
  on('p-add', addPlay); on('p-add2', addPlay);
  const addParlay = () => { draft = { type: 'parlay', date: pday, book: 'DK', stake: 1, legs: [], price: null, priceManual: false }; renderPlays(); };
  on('p-parlay', addParlay); on('p-parlay2', addParlay);
  $('board').querySelectorAll('[data-ptype]').forEach(b => b.onclick = () => {
    if (b.dataset.ptype === 'parlay' && draft.type !== 'parlay') {
      const first = draft.play ? [{ league: draft.league, matchup: draft.matchup, play: draft.play, price: draft.price, grade: draft.grade || null, date: draft.date, time: draft.time }] : [];
      draft = { type: 'parlay', date: draft.date, book: draft.book, stake: draft.stake, legs: first, price: null, priceManual: false };
    } else if (b.dataset.ptype === 'single' && draft.type === 'parlay') {
      syncDraft(); const l = draft.legs[0] || {};
      draft = { date: draft.date, time: l.time || '', league: l.league || league, matchup: l.matchup || '', play: l.play || '', price: l.price || -110, book: draft.book, stake: draft.stake, grade: l.grade || null };
    }
    renderPlays();
  });
  if (isParlay) {
    on('f-legadd', () => { syncDraft(); draft.legs.push({ league, matchup: '', play: '', price: -110, grade: null }); renderPlays(); });
    $('board').querySelectorAll('[data-legdel]').forEach(b => b.onclick = () => { syncDraft(); draft.legs.splice(+b.dataset.legdel, 1); renderPlays(); });
    const odds = () => { if (!draft.priceManual) { syncDraft(); const pp = parlayPrice(draft.legs); $('f-price').value = pp ? (pp > 0 ? '+' + pp : pp) : ''; } };
    draft.legs.forEach((_, i) => { const e = $(`f-lo-${i}`); if (e) e.oninput = () => { odds(); risk(); }; });
    const risk = () => { const st = +$('f-stake').value || 0, pr = priceNum($('f-price').value); $('f-risk').textContent = st > 0 ? `Risking ${money(st * U, false)}${isFinite(pr) && Math.abs(pr) >= 100 ? ` to win ${money(st * U * (pr > 0 ? pr / 100 : 100 / -pr), false)}` : ''}. ` : ''; };
    risk(); $('f-stake').oninput = risk; $('f-price').oninput = () => { draft.priceManual = true; risk(); };
    $('f-cancel').onclick = () => { draft = null; renderPlays(); };
    $('addf').onsubmit = async ev => {
      ev.preventDefault(); syncDraft();
      const legs = draft.legs.filter(l => l.play);
      const price = priceNum($('f-price').value);
      if (legs.length < 2) { $('f-msg').textContent = 'A parlay needs at least two legs.'; $('f-msg').className = 'msg err'; return; }
      if (!isFinite(price) || Math.abs(price) < 100) { $('f-msg').textContent = 'Enter the parlay odds, like +264.'; $('f-msg').className = 'msg err'; return; }
      if (!db) { $('f-msg').textContent = 'Plays can only be saved when the board is open on claude.ai while you\'re signed in.'; $('f-msg').className = 'msg err'; return; }
      const lgs = [...new Set(legs.map(l => l.league))];
      const doc = { type: 'parlay', date: $('f-date').value, time: legs.map(l => l.time).filter(Boolean).sort()[0] || '', league: lgs[0],
        matchup: `Parlay · ${legs.length} legs`, play: legs.map(l => l.play).join(' + '), price, book: $('f-book').value.trim() || '—',
        stake: +$('f-stake').value || 1, result: null, legs: legs.map(l => ({ league: l.league, matchup: l.matchup, play: l.play, price: priceNum(l.price), grade: l.grade || null })),
        created: new Date().toISOString() };
      try { await db.collection('plays').add(doc); draft = null; pday = doc.date; src = 'mine'; toast('Parlay saved'); renderPlays(); }
      catch (e) { $('f-msg').textContent = 'Could not save the parlay. Try again.'; $('f-msg').className = 'msg err'; }
    };
  } else if (f) {
    const risk = () => { const st = +$('f-stake').value || 0, pr = priceNum($('f-price').value); $('f-risk').textContent = st > 0 ? `Risking ${money(st * U, false)}${isFinite(pr) && Math.abs(pr) >= 100 ? ` to win ${money(st * U * (pr > 0 ? pr / 100 : 100 / -pr), false)}` : ''}. ` : ''; };
    risk(); $('f-stake').oninput = risk; $('f-price').oninput = risk;
    $('f-cancel').onclick = () => { draft = null; renderPlays(); };
    $('addf').onsubmit = async ev => {
      ev.preventDefault();
      const price = priceNum($('f-price').value);
      if (!isFinite(price) || Math.abs(price) < 100) { $('f-msg').textContent = 'Enter American odds like -110 or +150.'; $('f-msg').className = 'msg err'; return; }
      if (!db) { $('f-msg').textContent = 'Plays can only be saved when the board is open on claude.ai while you\'re signed in.'; $('f-msg').className = 'msg err'; return; }
      const doc = { date: $('f-date').value, time: $('f-time').value.trim(), league: $('f-league').value, matchup: $('f-matchup').value.trim(),
        play: $('f-play').value.trim(), price, book: $('f-book').value.trim() || '—', stake: +$('f-stake').value || 1, result: null,
        grade: f.grade || null, created: new Date().toISOString() };
      try { await db.collection('plays').add(doc); draft = null; pday = doc.date; src = 'mine'; toast('Play saved'); renderPlays(); }
      catch (e) { $('f-msg').textContent = e && e.code === 'quota_exceeded' ? 'The play log is full. Delete old plays to add more.' : 'Could not save the play. Try again.'; $('f-msg').className = 'msg err'; }
    };
  }
  $('board').querySelectorAll('[data-res]').forEach(b => b.onclick = async () => {
    const p = SRC[src].list().find(x => x.id === b.dataset.id); if (!p || !db) return;
    const r = p.result === b.dataset.res ? null : b.dataset.res;
    try { await db.collection(SRC[src].col).doc(p.id).update({ result: r }); } catch (e) { toast('Could not update the result.'); }
  });
  $('board').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirmDel !== b.dataset.del) { confirmDel = b.dataset.del; renderPlays(); return; }
    confirmDel = null;
    try { await db.collection(SRC[src].col).doc(b.dataset.del).delete(); toast('Play deleted'); } catch (e) { toast('Could not delete the play.'); }
  });
}

// Outside claude.ai (the standalone website) plays are kept in this browser instead.
function localDb() {
  const KEY = 'gushers-picks-v1';
  let store;
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return null; }
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage full or blocked */ } };
  const snap = col => ({ docs: Object.entries(store[col] || {}).map(([id, d]) => ({ id, exists: true, data: () => d })), metadata: { fromCache: false } });
  const emit = col => (subs[col] || []).forEach(cb => cb(snap(col)));
  const ref = (col, id) => ({
    set: async d => { (store[col] = store[col] || {})[id] = JSON.parse(JSON.stringify(d)); save(); emit(col); },
    update: async d => { if (!(store[col] || {})[id]) throw { code: 'invalid_argument' }; Object.assign(store[col][id], JSON.parse(JSON.stringify(d))); save(); emit(col); },
    delete: async () => { if (store[col]) delete store[col][id]; save(); emit(col); },
  });
  return {
    local: true,
    collection: col => ({
      onSnapshot: cb => { (subs[col] = subs[col] || []).push(cb); setTimeout(() => cb(snap(col)), 0); return () => {}; },
      add: async d => { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await ref(col, id).set(d); return { id }; },
      doc: id => ref(col, id),
    }),
    doc: path => { const [c, id] = path.split('/'); return ref(c, id); },
  };
}

(async () => {
  const api = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  db = api ? await api.use('db').catch(() => null) : null;
  if (!db) db = localDb();
  if (!db) { dbState = 'off'; if (mode === 'plays') renderPlays(); return; }
  const timer = setTimeout(() => { if (dbState === 'loading') { dbState = 'slow'; if (mode === 'plays') renderPlays(); } }, 10000);
  db.collection('plays').onSnapshot(snap => {
    const st = snap.docs.find(d => d.id === '_settings');
    if (st && +st.data().unitSize > 0) unitSize = +st.data().unitSize;
    if (st && +st.data().bankroll > 0) bank = { bankroll: +st.data().bankroll, pct: +st.data().bankPct || 1.5, since: st.data().bankSince || null };
    plays = snap.docs.filter(d => d.id !== '_settings').map(d => ({ id: d.id, ...d.data() })).filter(p => p.date && p.play);
    if (!snap.metadata.fromCache) clearTimeout(timer);
    dbState = 'ready';
    if (!autoGraded && !snap.metadata.fromCache) { autoGraded = true; setTimeout(() => gradeAll(true), 1500); }
    if (mode === 'plays') renderPlays(); else if (mode === 'home') renderHome();
  }, () => { clearTimeout(timer); dbState = 'off'; if (mode === 'plays') renderPlays(); });

})();

/* ---------------- navigation ---------------- */
function setMode(m) {
  mode = m;
  $('nav-home').setAttribute('aria-pressed', m === 'home');
  $('myplays').setAttribute('aria-pressed', m === 'plays');
  const inLeague = m === 'games' || m === 'props';
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', inLeague && b.dataset.lg === league));
  $('views').hidden = !inLeague || !LEAGUES[league].cats;
  $('v-games').setAttribute('aria-pressed', m === 'games');
  $('v-props').setAttribute('aria-pressed', m === 'props');
