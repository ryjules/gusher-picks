  $('q').hidden = !inLeague;
  if (m === 'plays') renderPlays(); else if (m === 'props') renderProps(); else if (m === 'home') renderHome(); else list();
  foot();
  window.scrollTo({ top: 0 });
}
function foot() {
  const m = DATA[league + '_meta'] || {};
  const bb = LEAGUES[league].sport === 'bb';
  $('foot').innerHTML = mode === 'home' ? `Data from ESPN, DraftKings (via ESPN) and Kalshi, pulled ${esc(DATA.generated.replace('T', ' ').replace('Z', ' UTC'))}. Picks and lines rebuild at 8:40 AM and 4:40 PM ET; live scores update every minute while this page is open.`
    : mode === 'plays' ? 'Your plays and the model picks are stored privately with this board. Profit uses each play\'s price: a win at -110 pays 0.91 units, a win at +150 pays 1.5 units, a loss costs the stake, a push is $0. Dollars are units times your unit size. Weeks run Monday to Sunday. ROI is profit divided by the amount risked on settled plays. Plays added with + Track grade themselves from final scores and box scores after the daily refresh.'
    : `Data from ESPN, pulled ${esc(DATA.generated.replace('T', ' ').replace('Z', ' UTC'))}: stats from ${m.games || 0} completed games across ${m.teams || 0} ${LEAGUES[league].n} teams. Lines are DraftKings via ESPN.
    ${bb ? 'L5 Rank uses each team\'s last 5 games; shooting percentages pool makes and attempts. Off and Def Rank use points per 100 possessions; L5 SOS ranks the average rating of the last 5 opponents (1st = toughest).'
      : 'L3 Rank uses each team\'s last 3 games. Off and Def Rank rank points scored and allowed per game. Penalties are yards per game; Pace is offensive plays per game. Touchdowns count only offensive rushing and passing scores.'}
    ${((DATA.checks || {})[league] || []).map(c => `${esc(c.source)}: ${c.verified ? `${c.verified} checked${c.problems ? `, ${c.problems} to review` : ', all match'}` : esc(c.note)}${c.verified && c.note ? ` (${esc(c.note)})` : ''}`).join(' · ')}<br>
    Confidence levels start from the stat matchup (each offense against the matching defense, recent games) and the price model adds or subtracts: Stats is the matchup score, Price is how far the line looks mispriced.
    Overall Rank and the price model come from a team-rating model fit to every score this season, adjusted for opponent and home court or field. It doesn't know about injuries or motivation, and lines move after this page is built, so check the live price before you bet.`;
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { league = b.dataset.lg; pgame = 'all'; setMode(mode === 'props' && LEAGUES[league].cats ? 'props' : 'games'); });
$('myplays').onclick = () => setMode('plays');

$('v-games').onclick = () => setMode('games');
$('v-props').onclick = () => setMode('props');
$('q').addEventListener('input', () => mode === 'props' ? renderProps() : list());
// League tabs show how many games are still to play.
document.querySelectorAll('.tabs button').forEach(b => { const n = (DATA[b.dataset.lg] || []).filter(g => g.state !== 'post').length; b.innerHTML += `<small>${n ? n + ' game' + (n > 1 ? 's' : '') : 'no games'}</small>`; });

/* ---------------- live scores ----------------
   The board is rebuilt twice a day, so scores come straight from ESPN's scoreboard every minute while the page is
   open. Only the score and game state change here: lines, confidence and picks stay locked at kickoff. */
const SCOREBOARD = { cfb: 'football/college-football/scoreboard?groups=80&limit=300', nfl: 'football/nfl/scoreboard',
  nba: 'basketball/nba/scoreboard', cbb: 'basketball/mens-college-basketball/scoreboard?groups=50&limit=300' };
let liveAt = null;
const SUMMARY = { cfb: 'football/college-football', nfl: 'football/nfl', nba: 'basketball/nba', cbb: 'basketball/mens-college-basketball' };
// A game that just ended: read its box score so picks grade now instead of at the next rebuild.
async function fetchFinal(lg, g) {
  if (g._finalTry && Date.now() - g._finalTry < 120000) return false;
  g._finalTry = Date.now();
  let d;
  try {
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${SUMMARY[lg]}/summary?event=${g.id}`, { cache: 'no-store' });
    if (!r.ok) return false;
    d = await r.json();
  } catch (e) { return false; }
  const comp = ((d.header || {}).competitions || [])[0] || {};
  if (!(((comp.status || {}).type || {}).completed)) return false;
  const sc = {}; for (const c of comp.competitors || []) sc[c.homeAway] = +c.score;
  g.final = { away: sc.away, home: sc.home, players: parseBox(d, lg) };
  return true;
}
function parseBox(d, lg) {
  const n = x => { const v = parseFloat(x); return isFinite(v) ? v : 0; };
  const players = {};
  for (const tm of ((d.boxscore || {}).players || [])) for (const cat of tm.statistics || []) {
    const lab = cat.labels || [];
    for (const a of cat.athletes || []) {
      const id = (a.athlete || {}).id; if (!id) continue;
      const v = {}; lab.forEach((k, i) => v[k] = (a.stats || [])[i]);
      const p = players[id] = players[id] || {};
      if (LEAGUES[lg].sport === 'bb') {
        if (v.MIN === undefined || v.MIN === '0' || v.MIN === '--') continue;
        Object.assign(p, { pts: n(v.PTS), reb: n(v.REB), ast: n(v.AST), stl: n(v.STL), blk: n(v.BLK), tpm: n(String(v['3PT'] || '0').split('-')[0]) });
      } else if (cat.name === 'passing') Object.assign(p, { passYds: n(v.YDS), passTD: n(v.TD) });
      else if (cat.name === 'rushing') Object.assign(p, { rushYds: n(v.YDS), rushTD: n(v.TD), car: n(v.CAR) });
      else if (cat.name === 'receiving') Object.assign(p, { recYds: n(v.YDS), recTD: n(v.TD), rec: n(v.REC) });
    }
  }
  for (const k of Object.keys(players)) if (!Object.keys(players[k]).length) delete players[k];
  return players;
}
// Live box scores for games in progress that have a pending prop, so prop bars can move during the game.
async function fetchLive(lg, g) {
  if (g._liveTry && Date.now() - g._liveTry < 55000) return false;
  g._liveTry = Date.now();
  try {
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${SUMMARY[lg]}/summary?event=${g.id}`, { cache: 'no-store' });
    if (!r.ok) return false;
    g.live = parseBox(await r.json(), lg);
    return true;
  } catch (e) { return false; }
}
// How close a pending pick is to hitting, from the live score or box score.
function liveBar(p) {
  const gr = p.grade; if (!gr) return '';
  const g = findGame(gr.league, gr.game); if (!g || g.state !== 'in' || !g.score) return '';
  const a = +g.score.away, h = +g.score.home; if (!isFinite(a) || !isFinite(h)) return '';
  let pct, good, text;
  if (gr.kind === 'total') {
    const cur = a + h; pct = Math.min(1, cur / gr.line);
    good = gr.side === 'over' ? cur > gr.line : cur < gr.line;
    text = `${cur} of ${gr.line} pts`;
  } else if (gr.kind === 'spread' || gr.kind === 'ml') {
    const m = gr.side === 'home' ? h - a : a - h, cov = gr.kind === 'spread' ? m + gr.line : m;
    pct = Math.max(0, Math.min(1, 0.5 + cov / 28)); good = cov > 0;
    text = gr.kind === 'spread' ? (cov > 0 ? `covering by ${cov}` : cov < 0 ? `short by ${-cov}` : 'on the number') : (m > 0 ? `up ${m}` : m < 0 ? `down ${-m}` : 'tied');
  } else if (gr.kind === 'prop') {
    if (!g.live) return `<div class="lbar wait"><small>live stats loading · ${esc(g.score.detail || '')}</small></div>`;
    const pl = g.live[gr.pid] || {};  // not in the box score yet: hasn't checked in
    const v = PROPVAL[gr.cat](pl) || 0; pct = Math.min(1, v / gr.line);
    good = gr.side === 'over' ? v > gr.line : v < gr.line;
    text = gr.side === 'over' ? (v > gr.line ? `${v} · hit` : `${v} of ${gr.line}, needs ${+(gr.line - v + 0.5).toFixed(1)}`) : (v < gr.line ? `${v} · ${+(gr.line - v).toFixed(1)} of room left` : `${v} · over the line`);
  } else return '';
  const under = gr.kind === 'total' || gr.kind === 'prop' ? gr.side === 'under' : false;
  const cls = good ? 'ok' : under ? 'bad' : 'go';
  return `<div class="lbar ${cls}" title="${esc(g.score.detail || '')}"><span><i style="width:${Math.round(pct * 100)}%"></i></span><small>${esc(text)} · ${esc(g.score.detail || '')}</small></div>`;
}
// Grade what can be graded now: your plays are saved; model picks show their result until the rebuild records it.
async function gradeLive() {
  let n = 0;
  for (const p of DATA.modelHistory || []) if (!p.result) { const r = gradeOf(p); if (r) { p.result = r; p.liveGraded = true; n++; } }
  if (plays.some(p => !p.result && gradeOf(p))) { await gradeAll(true); n++; }
  if (n && mode === 'plays') renderPlays();
}
async function pollScores() {
  if (document.hidden) return;
  let moved = false, changed = false, graded = false;
  for (const [lg, path] of Object.entries(SCOREBOARD)) {
    const games = DATA[lg] || [];
    if (!games.some(g => g.state !== 'post')) continue;
    let data;
    try {
      const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + path, { cache: 'no-store' });
      if (!r.ok) continue;
      data = await r.json();
    } catch (e) { continue; }  // offline, or this host blocks outside requests: keep the built scores
    for (const ev of data.events || []) {
      const g = games.find(x => x.id === ev.id);
      if (!g) continue;
      const comp = (ev.competitions || [])[0] || {}, side = {};
      for (const c of comp.competitors || []) side[c.homeAway] = c.score;
      const st = (ev.status || {}).type || {};
      const state = st.state || g.state, detail = st.shortDetail || st.detail || '';
      const score = { away: side.away ?? '', home: side.home ?? '', detail };
      if (state === 'pre') continue;
      const before = JSON.stringify([g.state, g.score]);
      if (g.state !== state) { moved = true; if (g.state === 'pre') g.liveOnly = true; }
      g.state = state; g.score = score;
      if (state === 'post' && !g.final && await fetchFinal(lg, g)) graded = true;
      if (JSON.stringify([g.state, g.score]) === before) continue;
      changed = true;
      if (lg === league && mode === 'games') {
        const b = document.querySelector(`.game-btn[data-id="${CSS.escape(g.id)}"] .st`);
        if (b) b.outerHTML = stHtml(g);
        const ban = document.querySelector(`.banner[data-live="${CSS.escape(g.id)}"]`);
        if (ban) ban.outerHTML = bannerHtml(g);
      }
    }
  }
  // Live box scores for in-progress games that have a pending prop (yours or the model's).
  const pend = [...(DATA.modelHistory || []), ...plays].filter(p => !p.result && p.grade?.kind === 'prop');
  let liveNew = false;
  for (const p of pend) { const g = findGame(p.grade.league, p.grade.game); if (g && g.state === 'in' && await fetchLive(p.grade.league, g)) liveNew = true; }
  if (mode === 'props') for (const g of (DATA[league] || []).filter(g => g.state === 'in' && (pgame === 'all' || g.id === pgame))) if (await fetchLive(league, g)) liveNew = true;
  if (liveNew && [...(DATA.modelHistory || []), ...plays].some(p => !p.result && p.grade?.kind === 'prop' && gradeOf(p))) graded = true;  // a prop decided mid-game
  if ((liveNew || changed) && mode === 'props') renderProps();
  if ((liveNew || changed) && mode === 'plays' && !draft) renderPlays();
  // Games that ended before this page loaded but after the last rebuild.
  for (const [lg] of Object.entries(SCOREBOARD)) for (const g of DATA[lg] || []) if (g.state === 'post' && !g.final && await fetchFinal(lg, g)) graded = true;
  if (graded) await gradeLive();
  if (changed) liveAt = new Date();
  // A game that just started or finished moves between the list's sections, so redraw the list itself.
  if (moved && mode === 'games') list();
  const tag = $('live-at');
  if (tag && liveAt) tag.textContent = 'Scores updated ' + liveAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
pollScores();
setInterval(pollScores, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollScores(); });
</script>
